name: sparkly

# Application service aliases resolve to the Docker host, even when a profile is off.
# step-ca uses Compose DNS directly and is deliberately absent from this list.
# Loopback (127.0.0.1) would point back to the calling container.
x-hosts: &hosts
  frontend: host-gateway
  backend: host-gateway
  analytics: host-gateway
  ml: host-gateway
  host.docker.internal: host-gateway

services:
  envoy:
    build: ./envoy
    depends_on:
      step-ca:
        condition: service_healthy
    ports:
      - "${ENVOY_PORT:-10000}:10000"
      - "${ENVOY_DEVICE_PORT:-10001}:10001"
      - "${ENVOY_ENROLLMENT_PORT:-10002}:10002"
    volumes:
      - envoy-pki:/run/envoy-pki:ro
    extra_hosts: *hosts

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    profiles: [frontend]
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    extra_hosts: *hosts

  backend:
    build: ./backend
    profiles: [backend]
    depends_on:
      postgres:
        condition: service_started
      step-ca:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      RABBITMQ_URL: "${RABBITMQ_URL:-amqp://${RABBITMQ_USER:-sparkly}:${RABBITMQ_PASSWORD:-sparkly}@rabbitmq:5672/${RABBITMQ_VHOST:-sparkly}}"
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-sparkly}
      POSTGRES_USER: ${POSTGRES_USER:-sparkly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sparkly}
      JWKS_MASTER_KEY: ${JWKS_MASTER_KEY:-sparkly-unsafe-private-masterkey}
      STEP_CA_URL: https://step-ca:9000
      STEP_CA_PROVISIONER: sparkly-devices
      STEP_CA_KEY_ID_FILE: /run/step-ca/provisioner.kid
      STEP_CA_ROOT_FILE: /run/step-ca/root_ca.crt
      STEP_CA_KEY_FILE: /run/step-ca/provisioner.key
    volumes:
      - device-pki:/run/step-ca:ro
    # PostgreSQL may still be starting, or supplied by a local dev server.
    restart: on-failure
    extra_hosts: *hosts

  analytics:
    build: ./analytics
    profiles: [analytics]
    depends_on:
      clickhouse:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "${ANALYTICS_PORT:-8081}:8081"
    environment:
      PORT: "8081"
      RAW_PERSISTENCE_WORKERS: "${RAW_PERSISTENCE_WORKERS:-4}"
      RABBITMQ_URL: "${RABBITMQ_URL:-amqp://${RABBITMQ_USER:-sparkly}:${RABBITMQ_PASSWORD:-sparkly}@rabbitmq:5672/${RABBITMQ_VHOST:-sparkly}}"
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_NATIVE_PORT: "9000"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-sparkly}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-sparkly}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-sparkly}
    restart: on-failure
    extra_hosts: *hosts

  ml:
    build: ./ml
    profiles: [ml]
    ports:
      - "${ML_PORT:-8082}:8082"
    environment:
      PORT: "8082"
    extra_hosts: *hosts

  step-ca:
    build: ./step-ca
    ports:
      - "${STEP_CA_PORT:-9001}:9000"
    environment:
      STEP_CA_NAME: ${STEP_CA_NAME:-Sparkly Device CA}
      STEP_CA_DNS_NAMES: ${STEP_CA_DNS_NAMES:-step-ca,localhost,host.docker.internal}
    volumes:
      - step-ca-data:/home/step
      - device-pki:/run/device-pki
      - envoy-pki:/run/envoy-pki
    healthcheck:
      test: [CMD, step, ca, health, --ca-url, "https://localhost:9000", --root, /home/step/certs/root_ca.crt]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: on-failure

  postgres:
    image: postgres:18-bookworm
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sparkly}
      POSTGRES_USER: ${POSTGRES_USER:-sparkly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sparkly}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-sparkly}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-sparkly}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-sparkly}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-sparkly}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-sparkly}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-sparkly}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user "$${CLICKHOUSE_USER}" --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data: {}
  rabbitmq-data: {}
  clickhouse-data: {}
  step-ca-data: {}
  device-pki: {}
  envoy-pki: {}
