version: v2
inputs:
  - proto_file: service.proto
plugins:
  - local: protoc-gen-go
    out: ..
    opt:
      - module=sparkly/backend
  - local: protoc-gen-connect-go
    out: ..
    opt:
      - module=sparkly/backend
  - local: protoc-gen-go-grpc
    out: ..
    opt:
      - module=sparkly/backend
