version: v2
inputs:
  - proto_file: service.proto
plugins:
  - local: protoc-gen-go
    out: ../..
    opt:
      - paths=source_relative
  - local: protoc-gen-connect-go
    out: ../..
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../..
    opt:
      - paths=source_relative
