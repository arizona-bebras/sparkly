syntax = "proto3";

package sparkly.backend.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "sparkly/backend/proto/v1;backendv1";

// ============================================================================
// 1. DOMAIN ENTITIES
// ============================================================================

message User {
  string id = 1;
  string email = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message Park {
  string id = 1;
  string name = 2;
  string description = 3;
  int32 device_count = 4;
  optional string token = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message DeviceGroup {
  string id = 1;
  string park_id = 2;
  string name = 3;
  string description = 4;
  int32 device_count = 5;
  optional string token = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message Device {
  string id = 1;
  string name = 2;
  string park_id = 3;
  repeated string group_ids = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

enum IssueSeverity {
  ISSUE_SEVERITY_UNSPECIFIED = 0;
  ISSUE_SEVERITY_INFO = 1;
  ISSUE_SEVERITY_LOW = 2;
  ISSUE_SEVERITY_MEDIUM = 3;
  ISSUE_SEVERITY_HIGH = 4;
  ISSUE_SEVERITY_CRITICAL = 5;
}

message Issue {
  string id = 1;
  string park_id = 2;
  string title = 3;
  string description = 4;
  bool is_resolved = 5;
  optional google.protobuf.Timestamp resolved_at = 6;
  IssueSeverity severity = 7;
  google.protobuf.Timestamp first_at = 8;
  google.protobuf.Timestamp last_at = 9;
}

message Build {
  string id = 1;
  string park_id = 2;
  string release_id = 3;
  string commit = 4;
  string elf_object_key = 5;
  string dwarf_object_key = 6;
  google.protobuf.Timestamp created_at = 7;
}

message Release {
  string id = 1;
  string park_id = 2;
  string name = 3;
  string version = 4;
  google.protobuf.Timestamp created_at = 5;
}

// ============================================================================
// 2. USER SERVICE MESSAGES
// ============================================================================

message RegRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  string password = 2 [(buf.validate.field).string.min_len = 6];
}

message RegResponse {
  string email = 1;
  string token = 2;
  string refresh_token = 3;
  int64 expires_in = 4;
}

message GetTokenRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  string password = 2 [(buf.validate.field).string.min_len = 6];
}

message GetTokenResponse {
  string email = 1;
  string token = 2;
  string refresh_token = 3;
  int64 expires_in = 4;
}

message RevokeTokenRequest {}

message RevokeTokenResponse {
  bool success = 1;
}

message CheckAuthRequest {}

message CheckAuthResponse {
  string email = 1;
  bool auth = 2;
}

message UpdateUserRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  optional string email = 2 [(buf.validate.field).string.email = true];
  optional string password = 3 [(buf.validate.field).string.min_len = 6];
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteUserResponse {
  bool success = 1;
}

// ============================================================================
// 3. PARK SERVICE MESSAGES
// ============================================================================

message CreateParkRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 30
  }];
  string description = 2 [(buf.validate.field).string.min_len = 1];
}

message CreateParkResponse {
  Park park = 1;
  string park_token = 2;
}

message GetParkRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetParkResponse {
  Park park = 1;
}

message GetAllParksRequest {}

message GetAllParksResponse {
  repeated Park parks = 1;
}

message UpdateParkRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  optional string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 30
  }];
  optional string description = 3 [(buf.validate.field).string.min_len = 1];
}

message UpdateParkResponse {
  Park park = 1;
}

message DeleteParkRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteParkResponse {
  bool success = 1;
}

// Device Groups Messages
message CreateGroupRequest {
  string park_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 30
  }];
  string description = 3 [(buf.validate.field).string.min_len = 1];
}

message CreateGroupResponse {
  DeviceGroup group = 1;
}

message GetGroupRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetGroupResponse {
  DeviceGroup group = 1;
}

message GetGroupsRequest {
  string park_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetGroupsResponse {
  repeated DeviceGroup groups = 1;
}

message UpdateGroupRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  optional string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 30
  }];
  optional string description = 3 [(buf.validate.field).string.min_len = 1];
}

message UpdateGroupResponse {
  DeviceGroup group = 1;
}

message DeleteGroupRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteGroupResponse {
  bool success = 1;
}

message AddDeviceToGroupRequest {
  string group_id = 1 [(buf.validate.field).string.uuid = true];
  string device_id = 2 [(buf.validate.field).string.uuid = true];
}

message AddDeviceToGroupResponse {
  bool success = 1;
}

message RemoveDeviceFromGroupRequest {
  string group_id = 1 [(buf.validate.field).string.uuid = true];
  string device_id = 2 [(buf.validate.field).string.uuid = true];
}

message RemoveDeviceFromGroupResponse {
  bool success = 1;
}

// ============================================================================
// 4. DEVICE SERVICE MESSAGES
// ============================================================================

message GetDeviceRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetDeviceResponse {
  Device device = 1;
}

message GetDevicesRequest {
  string park_id = 1 [(buf.validate.field).string.uuid = true];
  repeated string device_ids = 2 [(buf.validate.field).repeated.items.string.uuid = true];
  repeated string group_ids = 3 [(buf.validate.field).repeated.items.string.uuid = true];
  optional string name = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 30
  }];
  repeated string build_ids = 5 [(buf.validate.field).repeated.items.string.uuid = true];
}

message GetDevicesResponse {
  repeated Device devices = 1;
}

// ============================================================================
// 5. ISSUE SERVICE MESSAGES
// ============================================================================

message GetIssueRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetIssueResponse {
  Issue issue = 1;
}

message GetIssuesRequest {
  string park_id = 1 [(buf.validate.field).string.uuid = true];
  optional string title = 2;
  optional IssueSeverity severity = 3 [(buf.validate.field).enum.defined_only = true];
  optional bool is_resolved = 4;
  optional google.protobuf.Timestamp from_time = 5;
  optional google.protobuf.Timestamp to_time = 6;
}

message GetIssuesResponse {
  repeated Issue issues = 1;
}

message ResolveIssueRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message ResolveIssueResponse {
  Issue issue = 1;
}

message UpdateIssueRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  optional string title = 2 [(buf.validate.field).string.min_len = 1];
  optional string description = 3 [(buf.validate.field).string.min_len = 1];
  optional IssueSeverity severity = 4 [(buf.validate.field).enum.defined_only = true];
}

message UpdateIssueResponse {
  Issue issue = 1;
}

message DeleteIssueRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteIssueResponse {
  bool success = 1;
}

// ============================================================================
// 6. BUILD SERVICE MESSAGES
// ============================================================================

message CreateBuildRequest {
  string park_id = 1 [(buf.validate.field).string.uuid = true];
  optional string release_id = 2 [(buf.validate.field).string.uuid = true];
  optional string commit = 3;
  bytes elf_object = 4;
}

message CreateBuildResponse {
  Build build = 1;
}

message GetBuildRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetBuildResponse {
  Build build = 1;
}

message GetBuildsRequest {
  string park_id = 1 [(buf.validate.field).string.uuid = true];
  optional string release_id = 2 [(buf.validate.field).string.uuid = true];
  optional string commit = 3;
  optional google.protobuf.Timestamp from_time = 4;
  optional google.protobuf.Timestamp to_time = 5;
}

message GetBuildsResponse {
  repeated Build builds = 1;
}

message UpdateBuildRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  optional string release_id = 2 [(buf.validate.field).string.uuid = true];
  optional string commit = 3;
}

message UpdateBuildResponse {
  Build build = 1;
}

message DeleteBuildRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteBuildResponse {
  bool success = 1;
}

// ============================================================================
// 7. RELEASE SERVICE MESSAGES
// ============================================================================

message CreateReleaseRequest {
  string park_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2;
  string version = 3;
}

message CreateReleaseResponse {
  Release release = 1;
}

message GetReleaseRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetReleaseResponse {
  Release release = 1;
}

message GetReleasesRequest {
  string park_id = 1 [(buf.validate.field).string.uuid = true];
  optional string name = 2;
  optional string version = 3;
  optional google.protobuf.Timestamp from_time = 4;
  optional google.protobuf.Timestamp to_time = 5;
}

message GetReleasesResponse {
  repeated Release releases = 1;
}

message UpdateReleaseRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  optional string name = 2;
  optional string version = 3;
}

message UpdateReleaseResponse {
  Release release = 1;
}

message DeleteReleaseRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteReleaseResponse {
  bool success = 1;
}

// ============================================================================
// 8. SERVICES DEFINITIONS
// ============================================================================

service UserService {
  rpc Reg(RegRequest) returns (RegResponse);
  rpc GetToken(GetTokenRequest) returns (GetTokenResponse);
  rpc CheckAuth(CheckAuthRequest) returns (CheckAuthResponse);
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);

  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}

service ParkService {
  rpc CreatePark(CreateParkRequest) returns (CreateParkResponse);
  rpc GetPark(GetParkRequest) returns (GetParkResponse);
  rpc GetAllParks(GetAllParksRequest) returns (GetAllParksResponse);
  rpc UpdatePark(UpdateParkRequest) returns (UpdateParkResponse);
  rpc DeletePark(DeleteParkRequest) returns (DeleteParkResponse);

  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse);
  rpc GetGroups(GetGroupsRequest) returns (GetGroupsResponse);
  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse);
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);
  rpc AddDeviceToGroup(AddDeviceToGroupRequest) returns (AddDeviceToGroupResponse);
  rpc RemoveDeviceFromGroup(RemoveDeviceFromGroupRequest) returns (RemoveDeviceFromGroupResponse);
}

service DeviceService {
  rpc GetDevice(GetDeviceRequest) returns (GetDeviceResponse);
  rpc GetDevices(GetDevicesRequest) returns (GetDevicesResponse);
}

service IssueService {
  rpc GetIssue(GetIssueRequest) returns (GetIssueResponse);
  rpc GetIssues(GetIssuesRequest) returns (GetIssuesResponse);
  rpc ResolveIssue(ResolveIssueRequest) returns (ResolveIssueResponse);
  rpc UpdateIssue(UpdateIssueRequest) returns (UpdateIssueResponse);
  rpc DeleteIssue(DeleteIssueRequest) returns (DeleteIssueResponse);
}

service BuildService {
  rpc CreateBuild(CreateBuildRequest) returns (CreateBuildResponse);
  rpc GetBuild(GetBuildRequest) returns (GetBuildResponse);
  rpc GetBuilds(GetBuildsRequest) returns (GetBuildsResponse);
  rpc UpdateBuild(UpdateBuildRequest) returns (UpdateBuildResponse);
  rpc DeleteBuild(DeleteBuildRequest) returns (DeleteBuildResponse);
}

service ReleaseService {
  rpc CreateRelease(CreateReleaseRequest) returns (CreateReleaseResponse);
  rpc GetRelease(GetReleaseRequest) returns (GetReleaseResponse);
  rpc GetReleases(GetReleasesRequest) returns (GetReleasesResponse);
  rpc UpdateRelease(UpdateReleaseRequest) returns (UpdateReleaseResponse);
  rpc DeleteRelease(DeleteReleaseRequest) returns (DeleteReleaseResponse);
}
