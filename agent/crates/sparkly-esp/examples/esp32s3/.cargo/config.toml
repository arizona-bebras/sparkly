[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
linker = "sparkly-link"
rustflags = ["-C", "linker-flavor=gcc", "-C", "force-frame-pointers=yes", "-C", "link-arg=-Tlinkall.x", "-C", "link-arg=-Tdefmt.x"]

[unstable]
build-std = ["core"]

[env]
SPARKLY_REAL_LINKER = "xtensa-esp32s3-elf-gcc"
SPARKLY_LINKER_FLAVOR = "gcc"
SPARKLY_BARE_METAL = "true"
DEFMT_LOG = "info"
ESP_BACKTRACE_CONFIG_BACKTRACE_FRAMES = "16"
