[package]
name = "sparkly-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace]
members = ["crates/*"]
exclude = ["crates/sparkly-esp/examples/esp32s3"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
sparkly-core = { path = "crates/sparkly-core" }
sparkly-protocol = { path = "crates/sparkly-protocol" }
sparkly-macros = { path = "crates/sparkly-macros" }
heapless = { version = "0.9", default-features = false }
critical-section = "1.2"
log = { version = "0.4", default-features = false }
micropb = { version = "0.6", default-features = false, features = ["encode", "decode", "enable-64bit", "container-heapless-0-9"] }

[features]
default = ["log"]
log = ["dep:log"]
defmt = ["dep:defmt"]
# Only applications/tests select the synchronization provider.
std = ["critical-section/std"]

[dependencies]
sparkly-core.workspace = true
sparkly-protocol.workspace = true
sparkly-macros.workspace = true
heapless.workspace = true
critical-section.workspace = true
log = { workspace = true, optional = true }
defmt = { version = "1", optional = true }

[dev-dependencies]
critical-section = { workspace = true, features = ["std"] }
micropb.workspace = true
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
fs2 = "0.4"
tempfile = "3"

[[example]]
name = "host"
required-features = ["std", "log"]
