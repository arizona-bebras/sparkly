node:
  id: sparkly-gateway
  cluster: sparkly-gateway
static_resources:
  listeners:
    - name: ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                normalize_path: true
                merge_slashes: true
                path_with_escaped_slashes_action: REJECT_REQUEST
                codec_type: AUTO
                route_config:
                  name: services
                  max_direct_response_body_size_bytes: 65536
                  virtual_hosts:
                    - name: sparkly
                      domains: ["*"]
                      # New service routes inherit authentication by default.
                      typed_per_filter_config:
                        envoy.filters.http.jwt_authn:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                          requirement_name: access_token
                        envoy.filters.http.jwt_refresh:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                          disabled: true
                      routes:
                        - match: { path: /sparkly.backend.v1.UserService/Reg }
                          route: { cluster: backend }
                          typed_per_filter_config: &public
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              disabled: true
                            envoy.filters.http.rbac:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                        - match:
                            { path: /sparkly.backend.v1.UserService/GetToken }
                          route: { cluster: backend }
                          typed_per_filter_config: *public
                        - match: { prefix: /sparkly.backend. }
                          route: { cluster: backend }
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              requirement_name: backend_session
                            envoy.filters.http.jwt_refresh:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              requirement_name: backend_session
                        - match: { prefix: /sparkly.analytics. }
                          route: { cluster: analytics }
                        - match: { prefix: /sparkly.ml. }
                          route: { cluster: ml }
                        - match: { prefix: /sparkly. }
                          direct_response: { status: 404 }
                        - match:
                            path: /.well-known/root-ca.crt
                            headers: [{ name: ":method", string_match: { safe_regex: { regex: "GET|HEAD" } } }]
                          direct_response: &root_ca_download
                            status: 200
                            body: { filename: /run/envoy-pki/root_ca.crt }
                          response_headers_to_add: &root_ca_headers
                            - header: { key: content-type, value: application/x-pem-file }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            - header: { key: content-disposition, value: 'attachment; filename="root_ca.crt"' }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            - header: { key: cache-control, value: "public, max-age=300" }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          typed_per_filter_config: *public
                        - match: { path: /.well-known/root-ca.crt }
                          direct_response: { status: 405 }
                          response_headers_to_add: &root_ca_methods
                            - header: { key: allow, value: "GET, HEAD" }
                          typed_per_filter_config: *public
                        # Device endpoints must use their dedicated TLS listeners.
                        - match: { path: /devices/reg }
                          direct_response: { status: 404 }
                          typed_per_filter_config: *public
                        - match: { path: /ingest }
                          direct_response: { status: 404 }
                          typed_per_filter_config: *public
                        - match: { prefix: / }
                          route: { cluster: frontend }
                          typed_per_filter_config: *public
                forward_client_cert_details: SANITIZE
                http_filters:
                  - &strip_identity
                    name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        inline_string: |
                          function envoy_on_request(request)
                            local headers = request:headers()
                            headers:remove("x-device-id")
                            headers:remove("x-park-id")
                            headers:remove("x-user-id")
                            headers:remove("x-forwarded-client-cert")
                          end
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        backend:
                          from_cookies: [access_token]
                          require_expiration: true
                          # Envoy interprets 0 as the default 60-second skew.
                          clock_skew_seconds: 1
                          remote_jwks: &backend_jwks
                            http_uri:
                              uri: http://backend:8080/.well-known/jwks.json
                              cluster: backend
                              timeout: 2s
                            cache_duration: 300s
                          payload_in_metadata: access_token
                      requirement_map:
                        access_token: { provider_name: backend }
                        # RBAC requires a verified identity after both filters run.
                        backend_session: { allow_missing_or_failed: {} }
                  # Separate filters verify the cookies independently even though
                  # both token types share the same issuer and signing keys.
                  - name: envoy.filters.http.jwt_refresh
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        refresh:
                          from_cookies: [refresh_token]
                          require_expiration: true
                          clock_skew_seconds: 1
                          remote_jwks: *backend_jwks
                          payload_in_metadata: refresh_token
                      requirement_map:
                        backend_session: { allow_missing_or_failed: {} }
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      inline_code: |
                        function envoy_on_request(handle)
                          local headers = handle:headers()
                          headers:remove("x-user-id")
                          headers:remove("x-token-id")
                          local metadata = handle:streamInfo():dynamicMetadata():get("envoy.filters.http.jwt_authn") or {}
                          local function identity(payload, kind, claim, header)
                            if type(payload) ~= "table" or payload.type ~= kind then
                              return
                            end
                            local id = payload[claim]
                            if type(id) == "string" and #id > 0 and not id:find("[%z\1-\31\127]") then
                              headers:add(header, id)
                            end
                          end
                          identity(metadata.access_token, "access", "id", "x-user-id")
                          identity(metadata.refresh_token, "refresh", "token_id", "x-token-id")
                        end
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: ALLOW
                        policies:
                          access_identity:
                            permissions:
                              - any: true
                            principals:
                              - and_ids:
                                  ids:
                                    - sourced_metadata:
                                        metadata_source: DYNAMIC
                                        metadata_matcher:
                                          filter: envoy.filters.http.jwt_authn
                                          path:
                                            [{ key: access_token }, { key: id }]
                                          value:
                                            string_match:
                                              safe_regex:
                                                regex: '[^\x00-\x1f\x7f]+'
                                    - sourced_metadata:
                                        metadata_source: DYNAMIC
                                        metadata_matcher:
                                          filter: envoy.filters.http.jwt_authn
                                          path:
                                            [
                                              { key: access_token },
                                              { key: type },
                                            ]
                                          value:
                                            string_match: { exact: access }
                          refresh_identity:
                            # Only the backend has an interceptor that resolves
                            # the session in the database and issues a new cookie.
                            permissions:
                              - url_path:
                                  path: { prefix: /sparkly.backend. }
                            principals:
                              - and_ids:
                                  ids:
                                    - sourced_metadata:
                                        metadata_source: DYNAMIC
                                        metadata_matcher:
                                          filter: envoy.filters.http.jwt_authn
                                          path:
                                            [{ key: refresh_token }, { key: token_id }]
                                          value:
                                            string_match:
                                              safe_regex:
                                                regex: '[^\x00-\x1f\x7f]+'
                                    - sourced_metadata:
                                        metadata_source: DYNAMIC
                                        metadata_matcher:
                                          filter: envoy.filters.http.jwt_authn
                                          path:
                                            [{ key: refresh_token }, { key: type }]
                                          value:
                                            string_match: { exact: refresh }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: device_mtls
      address:
        socket_address: { address: 0.0.0.0, port_value: 10001 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              # Lua's peerCertificateValidated() is false for resumed sessions.
              disable_stateless_session_resumption: true
              disable_stateful_session_resumption: true
              common_tls_context:
                tls_params: { tls_minimum_protocol_version: TLSv1_2 }
                alpn_protocols: [h2, http/1.1]
                tls_certificate_sds_secret_configs: &gateway_certificate
                  - name: gateway-server
                    sds_config:
                      path_config_source: { path: /etc/envoy/server-secret.yaml }
                validation_context_sds_secret_config:
                  name: device-trust
                  sds_config:
                    path_config_source: { path: /etc/envoy/device-trust-secret.yaml }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: device_mtls
                codec_type: AUTO
                normalize_path: true
                merge_slashes: true
                path_with_escaped_slashes_action: REJECT_REQUEST
                forward_client_cert_details: SANITIZE
                route_config:
                  name: device_routes
                  virtual_hosts:
                    - name: devices
                      domains: ["*"]
                      routes:
                        - match:
                            path: /ingest
                            headers: [{ name: ":method", string_match: { exact: POST } }]
                          route: { cluster: analytics }
                        - match: { prefix: / }
                          direct_response: { status: 404 }
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        filename: /etc/envoy/device_identity.lua
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: device_enrollment
      address:
        socket_address: { address: 0.0.0.0, port_value: 10002 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_params: { tls_minimum_protocol_version: TLSv1_2 }
                alpn_protocols: [h2, http/1.1]
                tls_certificate_sds_secret_configs: *gateway_certificate
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: device_enrollment
                codec_type: AUTO
                normalize_path: true
                merge_slashes: true
                path_with_escaped_slashes_action: REJECT_REQUEST
                forward_client_cert_details: SANITIZE
                route_config:
                  name: enrollment_routes
                  max_direct_response_body_size_bytes: 65536
                  virtual_hosts:
                    - name: enrollment
                      domains: ["*"]
                      routes:
                        - match:
                            path: /.well-known/root-ca.crt
                            headers: [{ name: ":method", string_match: { safe_regex: { regex: "GET|HEAD" } } }]
                          direct_response: *root_ca_download
                          response_headers_to_add: *root_ca_headers
                        - match: { path: /.well-known/root-ca.crt }
                          direct_response: { status: 405 }
                          response_headers_to_add: *root_ca_methods
                        - match:
                            path: /devices/reg
                            headers: [{ name: ":method", string_match: { exact: POST } }]
                          route: { cluster: backend }
                        - match: { prefix: / }
                          direct_response: { status: 404 }
                http_filters:
                  - *strip_identity
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: frontend
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 2s
      load_assignment:
        cluster_name: frontend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: frontend, port_value: 3000 }
    - name: backend
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 2s
      load_assignment:
        cluster_name: backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: backend, port_value: 8080 }
    - name: analytics
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 2s
      load_assignment:
        cluster_name: analytics
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: analytics, port_value: 8081 }
    - name: ml
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 2s
      load_assignment:
        cluster_name: ml
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: ml, port_value: 8082 }
