resources:
  - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
    name: gateway-server
    tls_certificate:
      certificate_chain: { filename: /run/envoy-pki/server-chain.crt }
      private_key: { filename: /run/envoy-pki/server.key }
      watched_directory: { path: /run/envoy-pki }
