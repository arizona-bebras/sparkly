[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkly-ml"
version = "0.1.0"
description = "Sparkly ML analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sparkly-ml = "sparkly_ml.__main__:main"

[dependency-groups]
dev = ["ruff==0.17.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
required-version = "==0.17.0"
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
