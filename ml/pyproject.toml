[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkly-ml"
version = "0.1.0"
description = "Sparkly ML analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sparkly-ml = "sparkly_ml.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
