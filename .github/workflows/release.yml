name: Publish release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      registry: ${{ steps.release.outputs.registry }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Determine release coordinates
        id: release
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          import yaml

          ref = os.environ['RELEASE_REF']
          registry = f"ghcr.io/{os.environ['GITHUB_REPOSITORY'].lower()}"
          stable_version = r'(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)'
          if ref == 'refs/heads/main':
              chart_version = yaml.safe_load(Path('charts/sparkly/Chart.yaml').read_text())['version']
              if not isinstance(chart_version, str) or not re.fullmatch(stable_version, chart_version):
                  raise SystemExit('Chart.yaml version must be MAJOR.MINOR.PATCH, e.g. 0.1.0')
              # Run numbers increase across pushes and survive partial reruns.
              version = f"{chart_version}-main.{os.environ['GITHUB_RUN_NUMBER']}"
          else:
              release = re.fullmatch(rf'refs/tags/v({stable_version})', ref)
              if not release:
                  raise SystemExit('Release tag must be vMAJOR.MINOR.PATCH, e.g. v0.1.0')
              version = release.group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
              output.write(f'registry={registry}\n')
          PY

      - run: helm lint charts/sparkly --strict
      - run: python -m unittest discover -s charts/sparkly/tests -v

  images:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: envoy
            context: envoy
            dockerfile: envoy/Dockerfile
          - component: frontend
            context: .
            dockerfile: frontend/Dockerfile
          - component: backend
            context: backend
            dockerfile: backend/Dockerfile
          - component: analytics
            context: analytics
            dockerfile: analytics/Dockerfile
          - component: ml
            context: ml
            dockerfile: ml/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish release image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ needs.prepare.outputs.registry }}/${{ matrix.component }}:${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  chart:
    # Make the chart discoverable only after every release image was pushed.
    needs: [prepare, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Package chart for this release
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE_REGISTRY: ${{ needs.prepare.outputs.registry }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import shutil
          import subprocess
          import yaml
          staging = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sparkly'
          shutil.copytree('charts/sparkly', staging)
          values_path = staging / 'values.yaml'
          values = yaml.safe_load(values_path.read_text())
          values['global']['imageRegistry'] = os.environ['IMAGE_REGISTRY']
          values_path.write_text(yaml.safe_dump(values, sort_keys=False))
          version = os.environ['RELEASE_VERSION']
          subprocess.run(['helm', 'package', str(staging), '--version', version,
                          '--app-version', version, '--destination', os.environ['RUNNER_TEMP']], check=True)
          PY
      - name: Publish OCI chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_REGISTRY: ${{ needs.prepare.outputs.registry }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GHCR_USER" --password-stdin
          helm push "$RUNNER_TEMP/sparkly-$RELEASE_VERSION.tgz" "oci://$IMAGE_REGISTRY/charts"
