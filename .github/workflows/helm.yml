name: Helm chart

on:
  pull_request:
    paths: ['charts/**', 'envoy/**', '.github/workflows/helm.yml', '.github/workflows/release.yml']
  push:
    branches: [main]
    paths: ['charts/**', 'envoy/**', '.github/workflows/helm.yml', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: helm lint charts/sparkly --strict
      - run: python -m unittest discover -s charts/sparkly/tests -v
      - run: helm package charts/sparkly --destination /tmp
