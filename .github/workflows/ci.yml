name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      all:
        description: Run every component
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  NX_TUI: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  plan:
    name: Affected components
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-work: ${{ steps.plan.outputs.has-work }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test CI scripts
        run: node --test .github/scripts/*.test.mjs
      - name: Initial CI baseline
        id: baseline
        run: echo "sha=$(git rev-list --max-parents=0 HEAD | tail -n 1)" >> "$GITHUB_OUTPUT"
      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: main
          fallback-sha: ${{ steps.baseline.outputs.sha }}
      - name: Build component matrix
        id: plan
        env:
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all }}
        run: node .github/scripts/ci.mjs plan

  component:
    name: ${{ matrix.project }} · ${{ matrix.build && 'check & build' || 'check' }}
    needs: plan
    if: needs.plan.outputs.has-work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.2'
          cache: pnpm
      - uses: actions/setup-go@v7
        if: matrix.runtime == 'go'
        with:
          go-version-file: ${{ matrix.project }}/go.mod
          cache-dependency-path: ${{ matrix.project }}/go.mod
      - name: Set up Rust
        if: matrix.runtime == 'rust'
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
      - name: Install Protocol Buffers compiler
        if: matrix.project == 'agent'
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
      - name: Prepare host example CA certificate
        if: matrix.project == 'agent'
        run: |
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout "$RUNNER_TEMP/host-example-ca.key" \
            -out "$RUNNER_TEMP/host-example-ca.crt" \
            -days 1 -subj '/CN=Host example CI CA'
          rm "$RUNNER_TEMP/host-example-ca.key"
          echo "SPARKLY_CA_CERT=$RUNNER_TEMP/host-example-ca.crt" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        if: matrix.runtime == 'python'
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.0
        if: matrix.runtime == 'python'
        with:
          version: '0.9.17'
          enable-cache: true
          cache-dependency-glob: ml/uv.lock
      - name: Sync Python dependencies
        if: matrix.runtime == 'python'
        run: uv sync --project ml --locked
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare environment files
        run: |
          git ls-files -- '.env.example' '**/.env.example' | while IFS= read -r example; do
            cp "$example" "${example%.example}"
          done
      - name: Check
        id: check
        if: matrix.check
        run: pnpm exec nx run "$PROJECT:check" --outputStyle=static
      - name: Build
        id: build
        if: matrix.build
        run: pnpm exec nx run "$PROJECT:build" --outputStyle=static
      - name: Package build
        if: matrix.build && steps.build.outcome == 'success'
        env:
          BUILD_PATH: ${{ matrix.artifact }}
        run: tar -czf "$RUNNER_TEMP/build-$PROJECT.tar.gz" "$BUILD_PATH"
      - name: Upload build
        id: artifact
        if: matrix.build && steps.build.outcome == 'success'
        uses: LowderPlay/upload-s3-artifact@v0
        with:
          name: build-${{ matrix.project }}
          path: ${{ runner.temp }}/build-${{ matrix.project }}.tar.gz
          if-no-files-found: error
          archive: false
          s3-bucket: ${{ vars.S3_BUCKET }}
          s3-region: ${{ vars.S3_REGION || 'us-east-1' }}
          s3-endpoint: https://rustfs.komuk.ru
          s3-access-key-id: ${{ vars.S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          s3-force-path-style: true
      - name: Component summary
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          HAS_BUILD: ${{ matrix.build }}
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          UPLOAD_OUTCOME: ${{ steps.artifact.outcome }}
        run: node .github/scripts/ci.mjs report
      - name: Upload component result
        if: always()
        uses: LowderPlay/upload-s3-artifact@v0
        with:
          name: result-${{ matrix.project }}
          path: .ci-results/${{ matrix.project }}.json
          include-hidden-files: true
          if-no-files-found: error
          archive: false
          s3-bucket: ${{ vars.S3_BUCKET }}
          s3-region: ${{ vars.S3_REGION || 'us-east-1' }}
          s3-endpoint: https://rustfs.komuk.ru
          s3-access-key-id: ${{ vars.S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          s3-force-path-style: true
          s3-key-prefix: '{owner}/{repo}/{run_id}/{run_attempt}/results'
          presigned-url: false
          include-in-summary: false

  results:
    name: CI results
    needs: [plan, component]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.2'
      - name: Download component results
        if: needs.plan.outputs.has-work == 'true'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
          AWS_CONFIG_FILE: ${{ runner.temp }}/rustfs-aws-config
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          printf '[default]\ns3 =\n    addressing_style = path\n' > "$AWS_CONFIG_FILE"
          aws --endpoint-url https://rustfs.komuk.ru s3 cp \
            "s3://$S3_BUCKET/$GITHUB_REPOSITORY/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/results/" \
            .ci-results/ --recursive --exclude '*' --include '*.json' --only-show-errors
      - name: Summarize and check overall result
        if: always()
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          PLAN_RESULT: ${{ needs.plan.result }}
          COMPONENTS_RESULT: ${{ needs.component.result }}
        run: node .github/scripts/ci.mjs summary
