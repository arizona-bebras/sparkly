[package]
name = "sparkly-symbolicator"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
addr2line = "0.27"
anyhow = "1"
defmt-decoder = { version = "1.1", features = ["unstable"] }
hex = "0.4"
prost = "0.14"
pbjson = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
uuid = { version = "1", features = ["serde"] }
futures-lite = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
sparkly-build = { path = "../agent/crates/sparkly-build" }
lapin = { version = "4.12.3", default-features = false, features = ["tokio", "rustls", "rustls--ring", "rustls-native-certs"] }

[build-dependencies]
prost-build = "0.14"
pbjson-build = "0.9"

[dev-dependencies]
tempfile = "3"
sparkly-core = { path = "../agent/crates/sparkly-core" }
sparkly-protocol = { path = "../agent/crates/sparkly-protocol" }
